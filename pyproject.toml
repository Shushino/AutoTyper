[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autotype"
version = "0.1.0"
description = "Windows human-input document automation starter"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["python-docx"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
autotype = "autotype.cli:main"

[tool.setuptools]
packages = ["autotype", "autotype.behaviour"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
